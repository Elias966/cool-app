<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Prism</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; media-src 'self' data: blob:" />
  <script type="importmap">
    {
      "imports": {
        "three": "/vendor/three/build/three.module.js",
        "three/addons/": "/vendor/three/examples/jsm/"
      }
    }
  </script>
  <link rel="stylesheet" href="core/styles.css" />
</head>
<body>
  <canvas id="bg"></canvas>
  <div class="vignette"></div>
  <canvas id="fx"></canvas>
  <div id="cursor-glow"></div>

  <header class="titlebar">
    <div class="brand">
      <span class="brand-mark"><i></i><i></i><i></i><i></i><i></i><i></i></span>
      <span class="brand-name">PRISM</span>
      <span class="brand-crumb" id="crumb"></span>
    </div>
    <div class="titlebar-drag"></div>
    <div class="sound-ctl">
      <button class="win-btn sound-btn" id="sound-btn" aria-label="Sound settings" data-level="2">
        <svg viewBox="0 0 24 24"><path class="spk" d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path class="w1" d="M15.5 9.5a3.5 3.5 0 0 1 0 5"/><path class="w2" d="M17.8 7.2a6.7 6.7 0 0 1 0 9.6"/><path class="w3" d="M20 5a10 10 0 0 1 0 14"/><path class="x" d="M16 9.5l5 5M21 9.5l-5 5"/></svg>
      </button>
      <div class="sound-pop" id="sound-pop" hidden>
        <div class="sound-row"><span>Volume</span><span class="sound-pct"></span></div>
        <input type="range" min="0" max="100" step="1" data-sound="volume" aria-label="Volume" />
        <div class="sound-row">
          <button class="sound-chip" data-sound="mute" aria-pressed="true">Sound on</button>
          <button class="sound-chip" data-sound="typing" aria-pressed="true">Typing clicks</button>
        </div>
      </div>
    </div>
    <div class="win-controls">
      <button class="win-btn" data-win="minimize" title="Minimize" aria-label="Minimize">
        <svg viewBox="0 0 12 12"><path d="M2 6h8" /></svg>
      </button>
      <button class="win-btn" data-win="toggleMaximize" title="Maximize" aria-label="Maximize">
        <svg viewBox="0 0 12 12"><rect x="2.5" y="2.5" width="7" height="7" rx="1" /></svg>
      </button>
      <button class="win-btn win-close" data-win="close" title="Close" aria-label="Close">
        <svg viewBox="0 0 12 12"><path d="M3 3l6 6M9 3l-6 6" /></svg>
      </button>
    </div>
  </header>

  <nav class="dock" id="dock" aria-label="Modules"></nav>
  <main class="stage" id="stage"></main>
  <div class="toasts" id="toasts" aria-live="polite"></div>

  <script type="module" src="core/app.js"></script>
</body>
</html>
